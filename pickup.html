<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提取文件 · 爱搜云盘</title>
  <meta name="description" content="输入 5 位取件码即可提取爱搜云盘中的文件，支持有效期校验与过期提示。">
  <link rel="stylesheet" href="/tokens.css?v=1">
  <link rel="stylesheet" href="/style.css?v=7">
</head>
<body class="center-page">
  <main class="panel public-panel is-loading">
    <div class="logo">▤</div>
    <p class="eyebrow" id="codeLabel">取件文件</p>
    <h1 id="fileName">正在查询…</h1>
    <p class="muted" id="fileMeta"></p>
    <a id="download" class="button" hidden>下载文件</a>
    <p class="hint">请确认文件来源可信后再下载</p>
    <a class="back-link" href="/">← 返回取件页</a>
  </main>

  <script>
    const code = new URLSearchParams(location.search).get('code') || '';
    const label = document.querySelector('#codeLabel');
    const name = document.querySelector('#fileName');
    const meta = document.querySelector('#fileMeta');
    const download = document.querySelector('#download');
    const panel = document.querySelector('.public-panel');

    if (code) {
      label.textContent = '取件码 ' + code;
    }

    fetch('/api/pickup?code=' + encodeURIComponent(code))
      .then(r => r.json())
      .then(data => {
        if (!data.ok) throw new Error(data.error || '取件失败');
        panel.classList.remove('is-loading');
        name.textContent = data.name;
        const sizeMb = (data.size / 1024 / 1024).toFixed(2) + ' MB';
        const rem = data.remaining === null ? '' : ' · 剩余 ' + data.remaining + ' 次';
        meta.textContent = sizeMb + rem;
        download.href = data.downloadUrl;
        download.hidden = false;
      })
      .catch(error => {
        // 把浏览器/网络的原始报错翻译成用户看得懂的话，避免直接把 "Failed to fetch" 丢给用户
        const raw = String((error && error.message) || '');
        const friendly = /fetch|network|load failed|timeout/i.test(raw) ? '网络异常，请稍后重试' : (raw || '取件失败');
        panel.classList.remove('is-loading');
        panel.classList.add('is-error');
        label.textContent = '取件失败';
        name.textContent = friendly;
        meta.textContent = '请返回重新输入取件码';
      });
  </script>
</body>
</html>
