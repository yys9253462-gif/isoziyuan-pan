<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>爱搜云盘 · 文件提取</title>
  <meta name="description" content="爱搜云盘：输入取件码即可快速提取文件，支持多规格存储与安全分享，链接可设置有效期或永久有效。">
  <link rel="stylesheet" href="/style.css?v=6">
</head>
<body class="center-page">
  <a class="admin-link" href="/admin.html">管理员登录</a>

  <main class="panel public-panel">
    <div class="logo">⇩</div>
    <p class="eyebrow">爱搜云盘 · 极速提取</p>
    <h1>提取文件</h1>
    <p class="muted">请输入 5 位取件码</p>

    <form id="pickupForm">
      <div class="code-grid" role="group" aria-label="5 位取件码">
        <input inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="第 1 位" autocomplete="one-time-code" autofocus>
        <input inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="第 2 位">
        <input inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="第 3 位">
        <input inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="第 4 位">
        <input inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="第 5 位">
      </div>
      <button id="pickupButton" class="button" disabled>立即提取</button>
    </form>

    <p class="hint">文件安全存储于 Cloudflare R2 / AWS S3</p>
  </main>

  <script>
    const boxes = [...document.querySelectorAll('.code-grid input')];
    const button = document.querySelector('#pickupButton');

    function sync() {
      button.disabled = boxes.some(x => !x.value.trim());
    }

    function fill(text) {
      const digits = text.replace(/\D/g, '').slice(0, 5);
      digits.split('').forEach((v, i) => {
        if (boxes[i]) boxes[i].value = v;
      });
      const nextIdx = Math.min(digits.length, 4);
      boxes[nextIdx].focus();
      sync();
    }

    boxes.forEach((box, i) => {
      box.oninput = () => {
        box.value = box.value.replace(/\D/g, '').slice(-1);
        if (box.value && i < 4) boxes[i + 1].focus();
        sync();
      };
      box.onkeydown = e => {
        if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
        if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
        if (e.key === 'ArrowRight' && i < 4) boxes[i + 1].focus();
      };
      box.onpaste = e => {
        e.preventDefault();
        fill(e.clipboardData.getData('text'));
      };
    });

    document.querySelector('#pickupForm').onsubmit = e => {
      e.preventDefault();
      const code = boxes.map(x => x.value).join('');
      if (/^\d{5}$/.test(code)) {
        location.href = '/pickup/' + code;
      }
    };
  </script>
</body>
</html>
